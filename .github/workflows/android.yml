name: Android APK

# Every push to main builds the APK and publishes it at one fixed link that opens straight on a phone:
#   https://github.com/<owner>/<repo>/releases/latest/download/teyvat-nihongo.apk
# (also kept as an Actions artifact). Pushing a tag like v1.2.0 keeps a permanent release of that version.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build still running, so the download link always ends on the newest commit
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # web bundle without the service worker, copied into the Android project
      - run: npm run build:android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk teyvat-nihongo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: teyvat-nihongo-${{ github.run_number }}
          path: teyvat-nihongo.apk

      - name: Publish the "latest" download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-terbaru --cleanup-tag --yes || true
          gh release create apk-terbaru teyvat-nihongo.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Teyvat Nihongo · build ${{ github.run_number }}" \
            --notes "APK terbaru dari commit ${GITHUB_SHA::7}. Buka dari HP, unduh teyvat-nihongo.apk, lalu pasang (terpasang sebagai update, progres aman)."

      - name: Keep a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: teyvat-nihongo.apk
